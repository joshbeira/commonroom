name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -e ".[dev]"
      - run: python -m ruff check server tests scripts
      - run: python -m ruff format --check server tests scripts
      - run: python -m pytest --cov-fail-under=85
      - run: python -m pip_audit -r requirements.txt
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: python -m pip install -r requirements.txt -e .
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm format:check && pnpm build && pnpm audit --audit-level high
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm test:e2e
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build -t commonroom:test .
      - name: Container health and frontend smoke test
        run: |
          docker run -d --name commonroom -p 127.0.0.1:8000:8000 -e DEMO_ENABLED=true commonroom:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/healthz
          curl --fail http://127.0.0.1:8000/ | grep 'Commonroom'
      - run: docker logs commonroom
        if: always()
