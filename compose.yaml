services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      DEMO_ENABLED: "true"
      TRUSTED_HOSTS: localhost,127.0.0.1
    volumes:
      - ledger:/app/instance
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  ledger:
