[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commonroom"
version = "1.0.0"
description = "A considered home for shared expenses, with an auditable ledger and observable networking."
requires-python = ">=3.10"
dependencies = ["Flask>=3.1.2,<4", "Werkzeug>=3.1.3,<4", "Pillow>=12.1.0,<13", "waitress>=3.0.2,<4", "python-dotenv>=1.1,<2", "gunicorn>=26.2,<27; sys_platform != 'win32'", "libsql==0.1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["server*"]

[tool.setuptools.package-data]
server = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=server --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
