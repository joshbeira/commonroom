services:
  - type: web
    name: commonroom-ledger
    runtime: docker
    plan: free
    branch: codex/free-hosting
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_ENABLED
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: AUDIT_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
