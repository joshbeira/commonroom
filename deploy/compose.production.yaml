services:
  app:
    build:
      context: ..
    env_file: ../.env
    environment:
      APP_ENV: production
      DEMO_ENABLED: "false"
      TRUST_PROXY: "true"
    volumes:
      - ledger:/app/instance
    expose:
      - "8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
volumes:
  ledger:
  caddy_data:
  caddy_config:
networks:
  backend:
